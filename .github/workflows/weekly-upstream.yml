name: Weekly Zotero upstream sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Zotero plugin
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/openai/plugins /tmp/openai-plugins
          git -C /tmp/openai-plugins sparse-checkout set plugins/zotero

      - name: Synchronize vendored files
        id: upstream
        shell: bash
        run: |
          upstream_sha=$(git -C /tmp/openai-plugins rev-parse HEAD:plugins/zotero)
          python scripts/sync_upstream.py /tmp/openai-plugins/plugins/zotero --commit "$upstream_sha" --github-output "$GITHUB_OUTPUT"

      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugins/zotero-modified/tests -v
          node --check companion/zotero-modified-bridge/bootstrap.js
          python scripts/build_release.py --clean

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify release policy
        if: steps.changes.outputs.changed == 'true'
        id: policy
        run: python scripts/release_policy.py --working-tree --github-output "$GITHUB_OUTPUT"

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          UPSTREAM_SHA_SHORT: ${{ steps.upstream.outputs.upstream_sha_short }}
          RELEASE_KIND: ${{ steps.policy.outputs.release_kind }}
          FUNCTIONAL_FILES: ${{ steps.policy.outputs.functional_files }}
        shell: bash
        run: |
          branch="automation/zotero-upstream-${UPSTREAM_SHA_SHORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add plugins/zotero-modified upstream.json
          git commit -m "Sync OpenAI Zotero plugin ${UPSTREAM_VERSION}"
          git push origin "$branch"
          if [[ "$RELEASE_KIND" == "patch" ]]; then
            release_note="This PR changes runtime or skill files (${FUNCTIONAL_FILES}); merging it will automatically publish a patch release."
          else
            release_note="This PR changes only non-functional vendored files; merging it will not create a release."
          fi
          url=$(gh pr create --head "$branch" --base main --title "Sync OpenAI Zotero plugin ${UPSTREAM_VERSION}" --body "Automated weekly synchronization from openai/plugins at ${UPSTREAM_SHA_SHORT}. ${release_note} A manifest version change remains eligible for auto-merge after repository checks pass.")
          number=$(gh pr view "$url" --json number --jq .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for versioned upstream update
        if: steps.changes.outputs.changed == 'true' && steps.upstream.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
