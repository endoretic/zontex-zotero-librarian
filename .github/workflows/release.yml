name: Publish functional changes

on:
  push:
    branches: [main]
    paths:
      - "plugins/zotero-modified/scripts/**"
      - "plugins/zotero-modified/skills/**"
      - "companion/zotero-modified-bridge/bootstrap.js"
      - "scripts/build_release.py"
      - "scripts/release_policy.py"
  workflow_dispatch:
    inputs:
      force_patch:
        description: "Publish a patch release even when no functional file changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release policy
        id: policy
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_PATCH: ${{ inputs.force_patch || 'false' }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--base "$EVENT_BEFORE")
          fi
          if [[ "$FORCE_PATCH" == "true" ]]; then
            args+=(--force-patch)
          fi
          python scripts/release_policy.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Skip non-functional change
        if: steps.policy.outputs.release_kind == 'none'
        run: echo "No functional plugin change detected; no version or Release will be created."

      - name: Test
        if: steps.policy.outputs.release_kind == 'patch'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugins/zotero-modified/tests -v
          node --check companion/zotero-modified-bridge/bootstrap.js

      - name: Determine initial release
        if: steps.policy.outputs.release_kind == 'patch'
        id: initial
        shell: bash
        run: |
          if git tag --list 'v*' | grep -q .; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump paired patch version
        if: steps.policy.outputs.release_kind == 'patch' && steps.initial.outputs.value == 'false'
        run: python scripts/bump_version.py patch --github-output "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.policy.outputs.release_kind == 'patch' && steps.initial.outputs.value == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/zotero-modified/.codex-plugin/plugin.json companion/zotero-modified-bridge/manifest.json
          version=$(python -c "import json; print(json.load(open('plugins/zotero-modified/.codex-plugin/plugin.json'))['version'])")
          git commit -m "chore(release): v${version} [skip ci]"
          git push origin HEAD:main

      - name: Read release version
        if: steps.policy.outputs.release_kind == 'patch'
        id: version
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('plugins/zotero-modified/.codex-plugin/plugin.json'))['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        if: steps.policy.outputs.release_kind == 'patch'
        run: python scripts/build_release.py --clean --github-repository "${{ github.repository }}"

      - name: Publish GitHub release
        if: steps.policy.outputs.release_kind == 'patch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          target=$(git rev-parse HEAD)
          gh release create "v${VERSION}" dist/* --target "$target" \
            --notes-file dist/RELEASE_NOTES.md \
            --title "Zotero Modified ${VERSION}"
