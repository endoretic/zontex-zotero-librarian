name: Publish functional changes

on:
  push:
    branches: [main]
    paths:
      - "plugins/zontex/scripts/**"
      - "plugins/zontex/skills/**"
      - "plugins/zontex/.codex-plugin/plugin.json"
      - "companion/zontex-bridge/bootstrap.js"
      - "companion/zontex-bridge/manifest.json"
      - "scripts/build_release.py"
      - "scripts/release_policy.py"
  workflow_dispatch:
    inputs:
      force_patch:
        description: "Publish a patch release even when no functional file changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release policy
        id: policy
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          FORCE_PATCH: ${{ inputs.force_patch || 'false' }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--base "$EVENT_BEFORE")
          fi
          if [[ "$FORCE_PATCH" == "true" ]]; then
            args+=(--force-patch)
          fi
          python scripts/release_policy.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Skip non-functional change
        if: steps.policy.outputs.release_kind == 'none'
        run: echo "No functional plugin change detected; no version or Release will be created."

      - name: Test
        if: steps.policy.outputs.release_kind == 'patch'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugins/zontex/tests -v
          node tests/bridge_contract.test.cjs
          node --check companion/zontex-bridge/bootstrap.js

      - name: Determine release version strategy
        if: steps.policy.outputs.release_kind == 'patch'
        id: version_strategy
        env:
          EXPLICIT_VERSION: ${{ steps.policy.outputs.explicit_version }}
        shell: bash
        run: |
          plugin_version=$(python -c "import json; print(json.load(open('plugins/zontex/.codex-plugin/plugin.json'))['version'])")
          bridge_version=$(python -c "import json; print(json.load(open('companion/zontex-bridge/manifest.json'))['version'])")
          if [[ "$plugin_version" != "$bridge_version" ]]; then
            echo "Plugin and bridge versions must match." >&2
            exit 1
          fi

          if [[ "$EXPLICIT_VERSION" == "true" ]]; then
            if git rev-parse -q --verify "refs/tags/v${plugin_version}" >/dev/null; then
              echo "Explicit release v${plugin_version} already exists." >&2
              exit 1
            fi
            latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
            if [[ -n "$latest" ]]; then
              python -c 'import sys; parse=lambda value: tuple(map(int, value.split("."))); current=parse(sys.argv[1]); latest=parse(sys.argv[2]); current > latest or sys.exit(f"Explicit release {sys.argv[1]} must be newer than {sys.argv[2]}")' "$plugin_version" "${latest#v}"
            fi
            echo "use_current=true" >> "$GITHUB_OUTPUT"
          elif git tag --list 'v*' | grep -q .; then
            echo "use_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "use_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump paired patch version
        if: steps.policy.outputs.release_kind == 'patch' && steps.version_strategy.outputs.use_current == 'false'
        run: python scripts/bump_version.py patch --github-output "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.policy.outputs.release_kind == 'patch' && steps.version_strategy.outputs.use_current == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/zontex/.codex-plugin/plugin.json companion/zontex-bridge/manifest.json
          version=$(python -c "import json; print(json.load(open('plugins/zontex/.codex-plugin/plugin.json'))['version'])")
          git commit -m "chore(release): v${version} [skip ci]"
          git push origin HEAD:main

      - name: Read release version
        if: steps.policy.outputs.release_kind == 'patch'
        id: version
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('plugins/zontex/.codex-plugin/plugin.json'))['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        if: steps.policy.outputs.release_kind == 'patch'
        run: python scripts/build_release.py --clean --github-repository "${{ github.repository }}"

      - name: Publish GitHub release
        if: steps.policy.outputs.release_kind == 'patch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          target=$(git rev-parse HEAD)
          gh release create "v${VERSION}" dist/* --target "$target" \
            --notes-file dist/RELEASE_NOTES.md \
            --title "Zontex ${VERSION}"
